name: TrustFive free coding agent

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/trustfive-free-agent.yml
  schedule:
    # Off-peak minute to avoid the usual top-of-hour Actions congestion.
    - cron: '17 */2 * * *'

concurrency:
  group: trustfive-free-coding-agent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  coding-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Verify Grok credential without billable inference
        shell: bash
        env:
          XAI_API_KEY: ${{ secrets.GROK || secrets.GROK_API_KEY || secrets.XAI_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$XAI_API_KEY" ]]; then
            echo "::notice::No Grok/xAI key detected under GROK, GROK_API_KEY or XAI_API_KEY."
            exit 0
          fi
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 \
            --header "Authorization: Bearer $XAI_API_KEY" https://api.x.ai/v1/models)"
          if [[ "$status" == "200" ]]; then
            echo "::notice::Grok/xAI credential authenticated using a read-only model-list request. No tokens generated."
          else
            echo "::warning::Grok/xAI model-list authentication returned HTTP $status. No inference attempted."
          fi

      - name: Check free-model credentials and pending agent reviews
        id: gate
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.API_KEY || secrets.OPENROUTER }}
          GROK_PRESENT: ${{ secrets.GROK != '' || secrets.GROK_API_KEY != '' || secrets.XAI_API_KEY != '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            echo "::error::No OpenRouter key visible under OPENROUTER_API_KEY, API_KEY, or OPENROUTER. Check the names and repository vs environment scopes in GitHub Actions settings."
            if [[ "$GROK_PRESENT" == "true" ]]; then
              echo "::notice::A Grok/xAI secret is present, but it is not an OpenRouter key and no free Grok inference is confirmed."
            fi
            echo "### TrustFive free coding agent blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "The repository-level OPENROUTER_API_KEY secret is missing or unavailable. No inference or code edits were performed. See the development-branch docs/free-open-source-agent-runner.md for setup." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if gh pr list --repo "$GITHUB_REPOSITORY" --base feature/verified-marketplace-core --state open --json headRefName --jq '.[].headRefName' | grep -q '^agent/trustfive-'; then
            echo "::notice::A coding-agent pull request already awaits review; skipping duplicate work."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Checkout protected development source
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: feature/verified-marketplace-core
          fetch-depth: 0
          persist-credentials: false

      - name: Create isolated agent branch
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          git switch -c "agent/trustfive-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Set up Node.js
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install OpenCode CLI
        if: steps.gate.outputs.ready == 'true'
        run: npm install --global @opencode/cli

      - name: Verify OpenRouter credential without printing it
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.API_KEY || secrets.OPENROUTER }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 20 --header "Authorization: Bearer $OPENROUTER_API_KEY" \
            https://openrouter.ai/api/v1/auth/key)"
          if [[ "$status" != "200" ]]; then
            echo "::error::OpenRouter key validation returned HTTP $status. Rotate or correct the GitHub Actions secret."
            exit 1
          fi
          echo "::notice::OpenRouter key accepted; this check did not request any paid or free-model inference."

      - name: Check installed OpenCode CLI
        if: steps.gate.outputs.ready == 'true'
        run: |
          opencode --version
          opencode run --help > /dev/null

      - name: Run one bounded free-model coding cycle
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.API_KEY || secrets.OPENROUTER }}
        run: bash scripts/agent/run-one.sh

      - name: Validate changed files and Next.js build
        if: steps.gate.outputs.ready == 'true'
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          changed=false
          while IFS= read -r -d '' file; do
            changed=true
            case "$file" in
              app/*|components/*|lib/*|tests/*|docs/*|public/*)
                echo "Reviewed candidate path: $file" ;;
              *)
                echo "::error::Agent attempted to change a protected path: $file"
                exit 1 ;;
            esac
          done < <( (git diff --name-only -z; git ls-files --others --exclude-standard -z) | sort -zu )
          if [[ "$changed" != true ]]; then
            echo "::warning::NO_CODE_CHANGE: OpenCode produced no changed source files. A successful Actions job is not evidence that coding happened. Possible quota exhaustion, unavailable model or bounded task rejection."
            echo "### NO_CODE_CHANGE — no PR or source produced" >> "$GITHUB_STEP_SUMMARY"
            echo "Reason: the free-model coding cycle ended without any Git source edits. Inspect the model step for daily quota or transient provider errors; never count this as a delivered feature." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --check
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npm run build
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open draft pull request for review
        if: steps.validate.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "trustfive-agent[bot]"
          git config user.email "trustfive-agent@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Agent: one bounded TrustFive improvement"
          branch="$(git branch --show-current)"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' \"$GH_TOKEN\" | base64 -w0)" push --set-upstream origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --draft \
            --base feature/verified-marketplace-core --head "$branch" \
            --title "Agent: proposed TrustFive improvement" \
            --body "Automated bounded free-model coding proposal. Requires human review. Next.js build passed in the agent runner; full CI and security checks must pass before merging. No production changes are authorized."
